# Cloudflare Worker config for the WhatsApp campaign tool.
# Deploy with:  npx wrangler deploy
#
# 1) Create the KV namespace and paste its id below:
#       npx wrangler kv namespace create CAMPAIGNS_DB
#
# 2) Set secrets (never commit these):
#       npx wrangler secret put TWILIO_ACCOUNT_SID
#       npx wrangler secret put TWILIO_AUTH_TOKEN
#       npx wrangler secret put EMAIL_API_KEY        # when you pick a provider
#
# 3) Non-secret vars can live in [vars] below.

name = "whatsapp-campaigns"
main = "worker.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "CAMPAIGNS_DB"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Twilio sender — sandbox number or your approved WhatsApp business number.
TWILIO_WHATSAPP_FROM = "whatsapp:+14155238886"
# Used when a recipient number has no leading "+". Digits only. "1" = US/Canada.
DEFAULT_COUNTRY_CODE = "1"

# ── Email (fill in once you pick a provider) ──────────────────────
# EMAIL_PROVIDER = "resend"          # or "sendgrid"
# EMAIL_FROM     = "Campaigns <bot@yourcompany.com>"
# EMAIL_TO       = "you@yourcompany.com"
