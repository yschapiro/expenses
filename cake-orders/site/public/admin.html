<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orders Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background:#f7f3f7; }
  .top { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .top-in { max-width:1100px; margin:0 auto; padding:10px 16px 0; }
  .top h1 { font-size:20px; margin:0 0 8px; color:var(--accent); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .tabs { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .tabs a { padding:9px 14px; color:var(--muted); text-decoration:none; font-weight:600; border-bottom:3px solid transparent; white-space:nowrap; font-size:15px; }
  .tabs a.on { color:var(--accent); border-color:var(--accent); }
  .badge { background:var(--accent); color:#fff; border-radius:99px; font-size:11px; padding:1px 7px; margin-left:4px; vertical-align:middle; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:99px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .toolbar input[type=search] { max-width:240px; padding:7px 12px; }
  .orders { display:flex; flex-direction:column; gap:8px; }
  .orow { display:grid; grid-template-columns:110px 1fr auto; gap:12px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer; text-align:left; font:inherit; color:inherit; width:100%; }
  .orow:hover { border-color:var(--accent); }
  .odate b { display:block; font-size:15px; } .odate span { font-size:13px; color:var(--muted); }
  .oname { font-weight:700; } .oitems { font-size:14px; color:var(--muted); }
  .oright { text-align:right; font-size:14px; }
  .flag { color:var(--err); font-weight:700; font-size:13px; }
  table.t { width:100%; border-collapse:collapse; background:#fff; font-size:14px; }
  table.t th { text-align:left; font-size:13px; color:var(--muted); font-weight:600; padding:8px; border-bottom:1px solid var(--line); background:#faf7fa; position:sticky; top:0; }
  table.t td { padding:4px 6px; border-bottom:1px solid #f0eaf0; vertical-align:middle; }
  table.t td input { padding:6px 8px; border-radius:7px; font-size:14px; }
  table.t td.num { text-align:right; white-space:nowrap; }
  tr.short td { background:#fdecea; } tr.low td { background:#fff4dc; }
  .scroll { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:12px; }
  .x { border:0; background:none; color:#b9a7bc; cursor:pointer; font-size:16px; }
  .x:hover { color:var(--err); }
  .modal { position:fixed; inset:0; background:rgba(30,20,35,.45); z-index:20; display:flex; justify-content:flex-end; }
  .panel { background:#fff; width:min(640px, 100%); height:100%; overflow:auto; padding:20px; box-shadow:-10px 0 30px rgba(0,0,0,.15); }
  .panel h2 { margin:0; font-size:22px; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:4px 12px; font-size:15px; margin:12px 0; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; font-weight:600; }
  .items li { margin-bottom:8px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .terms-box { white-space:pre-wrap; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:10px; max-height:180px; overflow:auto; background:#fdfcfd; }
  .sigimg { height:90px; border-bottom:1px solid #999; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .daygroup h3 { font-size:15px; margin:18px 0 6px; color:var(--muted); }
  .copy { display:flex; gap:8px; } .copy input { font-size:13px; }
  .login { max-width:360px; margin:12vh auto; }
  .mail { border:1px solid var(--line); border-radius:10px; margin-bottom:10px; background:#fff; }
  .mail summary { padding:10px 12px; cursor:pointer; } .mail iframe { width:100%; height:420px; border:0; border-top:1px solid var(--line); }
  @media (max-width:700px) { .two { grid-template-columns:1fr; } .orow { grid-template-columns:84px 1fr; } .oright { grid-column:1 / -1; text-align:left; } .kv { grid-template-columns:100px 1fr; } }
  @media print { .top, .toolbar, .actions, .noprint { display:none !important; } }
</style>
</head>
<body>
<div id="demoBanner" class="demo-banner hidden">Demo mode – everything stays in this browser. <a href="index.html">Fill out the customer form →</a> · <a href="#" id="resetDemo">Reset demo</a></div>

<div id="login" class="login card hidden">
  <h2>Owner sign-in</h2>
  <div id="loginErr" class="msg err hidden"></div>
  <form id="loginForm"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn btn-main btn-block" style="margin-top:12px">Sign in</button></form>
</div>

<div id="app" class="hidden">
  <div class="top"><div class="top-in">
    <h1><span id="biz">Orders</span><button class="btn btn-ghost btn-small" id="logout">Sign out</button></h1>
    <nav class="tabs" id="tabs">
      <a href="#orders" data-tab="orders">Orders <span class="badge hidden" id="newCount"></span></a>
      <a href="#calendar" data-tab="calendar">Calendar</a>
      <a href="#inventory" data-tab="inventory">Inventory &amp; shopping</a>
      <a href="#recipes" data-tab="recipes">Recipes</a>
      <a href="#menu" data-tab="menu">Menu</a>
      <a href="#settings" data-tab="settings">Settings</a>
      <a href="#outbox" data-tab="outbox" class="hidden" id="outboxTab">Emails (demo)</a>
    </nav>
  </div></div>
  <main class="wrap wide" id="main"></main>
</div>
<div id="modal" class="modal hidden"><div class="panel" id="panel"></div></div>

<script src="js/config.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
